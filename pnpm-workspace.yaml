allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  prisma: set this to true or false
# PathPay pnpm settings
# pnpm 11 uses pnpm-workspace.yaml for both workspace declarations AND
# package-level settings. We use it here to enable build scripts for the
# native bindings our dev tooling needs.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma
  - unrs-resolver
  - workerd
