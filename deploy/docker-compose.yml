# PathPay infrastructure — Phase 01
# Runs ONLY Postgres 16 + Redis 7. The NestJS app runs locally via `make dev`
# or in its own container (Phase 12). Compose never orchestrates the app.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pathpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathpay
      POSTGRES_USER: pathpay
      POSTGRES_PASSWORD: pathpay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathpay -d pathpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pathpay-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data: